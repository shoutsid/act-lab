[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-computational-topology"
version = "0.1.0"
description = "Adaptive Computational Topology (ACT) - Dynamic architecture evolution during LLM pretraining"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "ACT Research Group" }]
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "tqdm>=4.65.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The suite is ~1050 tests of mostly CPU work on a many-core box; one worker per
# core with a single torch thread each (tests/conftest.py) is what turned a 4-minute
# serial run into well under one. Pass `-p no:xdist` or `-n 0` to run serially.
addopts = "-n auto"
